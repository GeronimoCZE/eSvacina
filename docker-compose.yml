services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: esvacina
      POSTGRES_PASSWORD: esvacina
      POSTGRES_DB: esvacina
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esvacina"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  app:
    build: .
    ports:
      - "4010:4010"
    environment:
      DATABASE_URL: postgresql://esvacina:esvacina@db:5432/esvacina
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-secret}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4010}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:4010}
      # Plain HTTP on localhost; set to true behind HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@esvacina.cz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db-data:
  uploads:
